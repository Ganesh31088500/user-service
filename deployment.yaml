apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  labels:
    app: user-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:

        - name: user-service

          image: apiwatch/user-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          envFrom:
            - configMapRef:
                name: user-config

            - secretRef:
                name: user-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082

            initialDelaySeconds: 40
            periodSeconds: 15