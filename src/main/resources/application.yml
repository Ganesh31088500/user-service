server:
  port: 8082

spring:
  application:
    name: USER-SERVICE

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/user_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoint:
    web:
      exposure:
        include: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    root: INFO
    com.apiwatch: DEBUG

jwt:
  secret: VGhpcy1pcy1BUElXYXRjaC1TdXBlci1TZWNyZXQtS2V5LUZvci1KV1QtMjAyNg==
  issuer: apiwatch-auth-service
  access-token-expiration: 900000
  refresh-token-expiration: 604800000